<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Kalkulator</title>
  <link rel="stylesheet" href="/src/output.css">
  <style>
    .calc-btn {
      @apply p-4 text-xl font-medium rounded-2xl transition-all duration-150 active:scale-95 flex items-center justify-center;
    }
  </style>
</head>
<body>
  <main class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg shadow-blue-500/10">
      <!-- Display Screen -->
      <div class="bg-slate-950 rounded-2xl px-4 py-4 mb-4 text-right overflow-hidden" aria-live="polite">
        <div id="expr" class="text-slate-400 text-sm h-5 truncate"></div>
        <div id="result" class="text-white text-4xl font-semibold mt-1 h-12 overflow-x-auto whitespace-nowrap tabular-nums">0</div>
      </div>
      
      <!-- Keypad Grid -->
      <div id="pad" class="grid grid-cols-4 gap-3"></div>
      <div class="mt-6 pt-4 border-t border-slate-800">
        <h2 class="text-xs font-semibold text-blue-400 mb-2 uppercase tracking-wider">Konversi Meter ke KM</h2>
        <div class="flex gap-2">
          <input type="number" id="unitInput" placeholder="Meter..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <button onclick="convertUnit()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-xl transition">Hitung</button>
        </div>
        <p id="unitResult" class="text-slate-400 text-xs mt-2 min-h-[16px]"></p>
      </div>
    </div>
  </main>
  <script src="../script/calculator.js"></script>
</body>
</html>
